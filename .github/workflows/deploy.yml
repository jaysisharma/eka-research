name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================================================
  # 1. BUILD & PUSH DOCKER IMAGES
  # =========================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Main App Image
      - name: Build & Push App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migration Image
      - name: Build & Push Migration Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository }}/app:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # 2. RUN DATABASE MIGRATIONS
  # =========================================================
  migrate:
    name: Run Neon DB Migration
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

  # =========================================================
  # 3. DEPLOY TO SERVER
  # =========================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate

    steps:
      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/app/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_ACTOR: ${{ github.actor }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: DATABASE_URL,DIRECT_URL,ACCESS_TOKEN,GH_ACTOR

          script: |
            set -e

            cd /opt/app

            # Create .env
            echo "DATABASE_URL=$DATABASE_URL" > .env
            echo "DIRECT_URL=$DIRECT_URL" >> .env

            # Login to GHCR
            echo "$ACCESS_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull latest images
            docker compose pull

            # Restart containers
            docker compose up -d --force-recreate --remove-orphans

            # Cleanup unused images
            docker image prune -f

            echo "Deployment completed successfully ✅"