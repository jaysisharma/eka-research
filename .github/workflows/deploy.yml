name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Build images and push to GHCR ──────────────────────────────────────
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # App image — runner stage (default target)
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/eka-research-app:latest
          # Dummy DATABASE_URL so Next.js build doesn't fail without a real DB.
          # generateStaticParams() already wraps its DB call in try/catch.
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migrator image — migrator stage only
      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository }}/eka-research-app:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to server ────────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/eka_research/"

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          AUTH_SECRET:             ${{ secrets.AUTH_SECRET }}
          AUTH_URL:                ${{ secrets.AUTH_URL }}
          POSTGRES_USER:           ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:             ${{ secrets.POSTGRES_DB }}
          CLOUDINARY_CLOUD_NAME:   ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:      ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:   ${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST:               ${{ secrets.SMTP_HOST }}
          SMTP_PORT:               ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:             ${{ secrets.SMTP_SECURE }}
          SMTP_USER:               ${{ secrets.SMTP_USER }}
          SMTP_PASS:               ${{ secrets.SMTP_PASS }}
          SMTP_FROM:               ${{ secrets.SMTP_FROM }}
          ACCESS_TOKEN:            ${{ secrets.ACCESS_TOKEN }}
          GH_ACTOR:                ${{ github.actor }}
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL,AUTH_SECRET,AUTH_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM,ACCESS_TOKEN,GH_ACTOR
          script: |
            set -e
            cd /opt/eka_research

            # ── Write .env from secrets ──────────────────────────────────
            printf 'DATABASE_URL=%s\n'          "$DATABASE_URL"          >  .env
            printf 'AUTH_SECRET=%s\n'           "$AUTH_SECRET"           >> .env
            printf 'AUTH_URL=%s\n'              "$AUTH_URL"              >> .env
            printf 'POSTGRES_USER=%s\n'         "$POSTGRES_USER"         >> .env
            printf 'POSTGRES_PASSWORD=%s\n'     "$POSTGRES_PASSWORD"     >> .env
            printf 'POSTGRES_DB=%s\n'           "$POSTGRES_DB"           >> .env
            printf 'CLOUDINARY_CLOUD_NAME=%s\n' "$CLOUDINARY_CLOUD_NAME" >> .env
            printf 'CLOUDINARY_API_KEY=%s\n'    "$CLOUDINARY_API_KEY"    >> .env
            printf 'CLOUDINARY_API_SECRET=%s\n' "$CLOUDINARY_API_SECRET" >> .env
            printf 'SMTP_HOST=%s\n'              "$SMTP_HOST"             >> .env
            printf 'SMTP_PORT=%s\n'              "$SMTP_PORT"             >> .env
            printf 'SMTP_SECURE=%s\n'            "$SMTP_SECURE"           >> .env
            printf 'SMTP_USER=%s\n'              "$SMTP_USER"             >> .env
            printf 'SMTP_PASS=%s\n'              "$SMTP_PASS"             >> .env
            printf 'SMTP_FROM=%s\n'              "$SMTP_FROM"             >> .env

            # ── Authenticate with GHCR ────────────────────────────────────
            echo "$ACCESS_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # ── Pull latest images ────────────────────────────────────────
            docker compose pull

            # ── Remove stale containers (if any) ─────────────────────────
            # docker compose rm only removes containers it knows about.
            # Force-remove by name so a container started outside compose
            # (e.g. a previous failed run) never blocks the next deploy.
            docker rm -f eka_app    2>/dev/null || true
            docker rm -f eka_migrate 2>/dev/null || true

            # ── Deploy ───────────────────────────────────────────────────
            docker compose up -d --force-recreate --remove-orphans

            # ── Health check ─────────────────────────────────────────────
            echo "Waiting for app to become healthy..."
            attempt=0
            until docker inspect --format='{{.State.Health.Status}}' eka_app 2>/dev/null | grep -q healthy; do
              attempt=$((attempt + 1))
              if [ $attempt -ge 20 ]; then
                echo "App did not become healthy in time. Last logs:"
                docker compose logs --tail=50 app
                exit 1
              fi
              sleep 5
            done
            echo "App is healthy ✓"

            # ── Clean up dangling images only (safe) ─────────────────────
            docker image prune -f
