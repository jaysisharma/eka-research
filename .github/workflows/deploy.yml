name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================================================
  # 1. BUILD & PUSH DOCKER IMAGES
  # =========================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Login to GitHub Container Registry
      # -----------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------
      # Setup Docker Buildx
      # -----------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------
      # Build & Push Main App Image
      # -----------------------------------------------------
      - name: Build & Push App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/eka-research-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------
      # Build & Push Migration Image
      # -----------------------------------------------------
      - name: Build & Push Migration Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository }}/eka-research-app:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # 2. DEPLOY APPLICATION (Postgres runs on the server)
  # =========================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build

    steps:

      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Verify Files
      # -----------------------------------------------------
      - name: Verify Files
        run: |
          pwd
          ls -la
          cat docker-compose.yml

      # -----------------------------------------------------
      # Copy docker-compose.yml + server scripts to Server
      # -----------------------------------------------------
      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,scripts/server/ensure-db.sh,scripts/server/backup-db.sh"
          target: "/opt/app/"

      # -----------------------------------------------------
      # Deploy Application via SSH
      # -----------------------------------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: POSTGRES_PASSWORD,NEON_DATABASE_URL,ACCESS_TOKEN,GH_ACTOR,AUTH_SECRET,AUTH_URL,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM

          script: |
            set -e

            cd /opt/app
            chmod +x scripts/server/*.sh

            # Password goes into a URL unencoded — keep it URL-safe.
            if [ -z "$POSTGRES_PASSWORD" ] || ! printf '%s' "$POSTGRES_PASSWORD" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "❌ POSTGRES_PASSWORD secret must be set and contain only A-Z a-z 0-9 _ -"
              exit 1
            fi

            # =================================================
            # CREATE .env FILE
            # =================================================

            echo "POSTGRES_USER=eka" > .env
            echo "POSTGRES_DB=eka" >> .env
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
            echo "DATABASE_URL=postgresql://eka:$POSTGRES_PASSWORD@eka_postgres:5432/eka" >> .env
            echo "AUTH_SECRET=$AUTH_SECRET" >> .env
            echo "AUTH_URL=$AUTH_URL" >> .env
            echo "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" >> .env
            echo "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" >> .env
            echo "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET" >> .env
            echo "SMTP_HOST=$SMTP_HOST" >> .env
            echo "SMTP_PORT=$SMTP_PORT" >> .env
            echo "SMTP_SECURE=$SMTP_SECURE" >> .env
            echo "SMTP_USER=$SMTP_USER" >> .env
            echo "SMTP_PASS=$SMTP_PASS" >> .env
            echo "SMTP_FROM=$SMTP_FROM" >> .env

            # =================================================
            # LOGIN TO GHCR
            # =================================================

            echo "$ACCESS_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # =================================================
            # PULL LATEST IMAGES
            # =================================================

            docker compose --profile migrate pull app migrator

            # =================================================
            # POSTGRES: create container/database only if missing
            # =================================================

            ./scripts/server/ensure-db.sh

            # =================================================
            # RUN DATABASE MIGRATIONS
            # =================================================

            docker compose run --rm migrator

            # =================================================
            # RECREATE APP ONLY (never touches Postgres)
            # =================================================

            docker rm -f eka_app 2>/dev/null || true

            docker compose up -d --no-deps --force-recreate app

            # =================================================
            # BACKUP CRON (daily 02:00, idempotent)
            # =================================================

            mkdir -p /opt/app/backups
            CRON_LINE="0 2 * * * /opt/app/scripts/server/backup-db.sh >> /opt/app/backups/backup.log 2>&1 # eka-db-backup"
            ( crontab -l 2>/dev/null | grep -v '# eka-db-backup' || true; echo "$CRON_LINE" ) | crontab -

            # =================================================
            # CLEANUP UNUSED IMAGES
            # =================================================

            docker image prune -f

            # =================================================
            # SHOW RUNNING CONTAINERS
            # =================================================

            docker ps

            echo "✅ Deployment completed successfully"